<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>论文</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; overflow: hidden;
    font-family: var(--wm-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    font-size: 13px; color: var(--wm-ink, #1f2430);
    background: var(--wm-bg-base, #fff);
  }
  #side {
    width: 250px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--wm-border, #e3e6ec);
    background: var(--wm-bg-sidebar, #f7f8fa);
  }
  #sidehead {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--wm-border, #e3e6ec);
  }
  #sidehead h2 { margin: 0; flex: 1; font-size: 12px; font-weight: 600; color: var(--wm-label-2nd, #5b6474); }
  #tabs { display: flex; gap: 4px; padding: 8px 10px 0; }
  #tabs button {
    flex: 1; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--wm-border, #d7dbe3);
    border-bottom: none; border-radius: var(--wm-radius-sm, 4px) var(--wm-radius-sm, 4px) 0 0;
    background: transparent; color: var(--wm-label-2nd, #5b6474);
  }
  #tabs button.on { background: var(--wm-bg-panel, #fff); color: var(--wm-ink, #1f2430); font-weight: 600; }
  #imp { padding: 8px 10px; border-bottom: 1px solid var(--wm-border, #e3e6ec); }
  #imp input {
    width: 100%; font: inherit; padding: 5px 7px; border-radius: var(--wm-radius-sm, 4px);
    border: 1px solid var(--wm-border, #d7dbe3); background: var(--wm-bg-input, #fff); color: var(--wm-ink, #1f2430);
  }
  #imp .row { display: flex; gap: 6px; margin-top: 6px; }
  #imp .row button { flex: 1; }
  #err { margin-top: 6px; font-size: 11px; color: #b4463c; line-height: 1.5; word-break: break-all; }
  #list { flex: 1; overflow-y: auto; }
  .paper {
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--wm-border-soft, #eef0f4);
    color: var(--wm-label, #3a4152);
  }
  .paper:hover { background: var(--wm-bg-hover, #eef1f6); }
  .paper.active { background: var(--wm-bg-active, #e4ebf7); color: var(--wm-ink, #1f2430); }
  .paper .t { display: block; line-height: 1.35; }
  .paper .m { display: block; margin-top: 3px; font-size: 11px; color: var(--wm-label-dim, #8b93a3); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--wm-border, #e3e6ec); background: var(--wm-bg-panel, #fbfbfd);
  }
  #bar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  button {
    font: inherit; padding: 4px 10px; border-radius: var(--wm-radius-sm, 4px);
    border: 1px solid var(--wm-border, #d7dbe3); background: var(--wm-bg-panel, #fff);
    color: var(--wm-ink, #1f2430); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--wm-bg-hover, #eef1f6); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--wm-accent, #3b6ea5); border-color: var(--wm-accent, #3b6ea5); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--wm-accent-hi, #2f5c8d); }
  button.link {
    border: none; background: none; color: var(--wm-accent, #3b6ea5);
    padding: 1px 4px; text-decoration: underline; cursor: pointer;
  }
  button.link:hover:not(:disabled) { background: none; opacity: .75; }
  #page {
    flex: 1; overflow-y: auto; padding: 18px 26px; line-height: 1.75;
    font-family: var(--wm-mono, ui-monospace, Menlo, Consolas, monospace);
    white-space: pre-wrap; word-break: break-word; user-select: text;
  }
  #page::selection { background: var(--wm-accent-weak, #d6e4f5); }
  #page mark {
    background: var(--wm-accent-weak, #ffe9a8); color: inherit; border-radius: 2px; padding: 1px 0;
  }
  #empty { padding: 40px 26px; color: var(--wm-label-dim, #8b93a3); line-height: 1.8; }
  #hint {
    padding: 8px 12px; border-top: 1px solid var(--wm-border, #e3e6ec);
    color: var(--wm-label-dim, #8b93a3); font-size: 12px;
    display: flex; align-items: center; gap: 10px; background: var(--wm-bg-panel, #fbfbfd);
  }
  #status { flex: 1; }
  #quote { color: var(--wm-ink, #1f2430); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* —— 研究记录视图 —— */
  #record { flex: 1; overflow-y: auto; padding: 20px 28px; line-height: 1.7; }
  #record h2 { margin: 0 0 4px; font-size: 15px; }
  #record .meta { color: var(--wm-label-dim, #8b93a3); font-size: 12px; margin-bottom: 16px; }
  #record .badge {
    display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px;
    border: 1px solid var(--wm-border, #d7dbe3); color: var(--wm-label-2nd, #5b6474);
  }
  #record .badge.warn { border-color: #d8a13a; color: #9a6c14; }
  #record .badge.ok { border-color: #4a8f5c; color: #2f6b3e; }
  #record .claim {
    border-left: 3px solid var(--wm-border, #d7dbe3); padding: 2px 0 2px 12px; margin: 0 0 16px;
  }
  #record .claim.support { border-left-color: #4a8f5c; }
  #record .claim.counterevidence { border-left-color: #b4463c; }
  #record .claim.gap { border-left-color: #d8a13a; }
  #record .ct { font-weight: 600; margin-bottom: 4px; }
  #record .ev { margin: 6px 0 0 2px; color: var(--wm-label, #3a4152); }
  #record .ev blockquote {
    margin: 4px 0 0; padding: 6px 10px; border-left: 2px solid var(--wm-border, #d7dbe3);
    color: var(--wm-label-2nd, #5b6474); font-size: 12px;
  }
  #record h3 { font-size: 12px; color: var(--wm-label-2nd, #5b6474); margin: 20px 0 6px; text-transform: none; }
  #record ul { margin: 0; padding-left: 20px; }
  #record .ev.data { border-left: 2px dashed var(--wm-border, #d7dbe3); padding-left: 8px; margin-top: 6px; }
  #record .ev.data .rq { font-weight: 600; }
  #record .ev.data .rm { color: var(--wm-label-dim, #8b93a3); font-size: 11px; margin-top: 2px; }
  #record .check { margin-top: 6px; font-size: 11px; padding: 4px 8px; border-radius: var(--wm-radius-sm, 4px);
    border: 1px solid var(--wm-border, #d7dbe3); color: var(--wm-label-2nd, #5b6474); }
  #record .check.matched { border-color: #4a8f5c; color: #2f6b3e; }
  #record .check.mismatch { border-color: #b4463c; color: #8f362e; }
  #record .check.unresolved { border-color: #d8a13a; color: #9a6c14; }
  #receiptpick { margin-left: 8px; max-width: 260px; }
  #record .foot {
    margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--wm-border, #e3e6ec);
    color: var(--wm-label-dim, #8b93a3); font-size: 12px; line-height: 1.7;
  }
  #record .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
</style>
</head>
<body>
  <div id="side">
    <div id="sidehead">
      <h2 id="sideTitle">论文库</h2>
      <button id="pick">导入 PDF</button>
    </div>
    <div id="tabs">
      <button id="tabPapers" class="on">论文</button>
      <button id="tabRecords">研究记录</button>
    </div>
    <div id="imp" hidden>
      <input id="path" type="text" placeholder="PDF 的绝对路径" spellcheck="false" />
      <div class="row">
        <button id="browse">选择文件</button>
        <button id="doimport" class="primary">导入</button>
      </div>
      <div id="err"></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="bar">
      <span class="title" id="title">未选择论文</span>
      <button id="prev">上一页</button>
      <span id="pager"></span>
      <button id="next">下一页</button>
      <select id="receiptpick" hidden></select>
      <button id="send" class="primary" disabled>发送给 Agent</button>
    </div>
    <div id="page"><div id="empty">论文库还是空的。<br />点左上的「导入 PDF」选一篇，或用 Agent 的 <code>Paper</code> 工具导入。</div></div>
    <div id="record" hidden></div>
    <div id="hint"><span id="status">选中正文里的一段，再点「发送给 Agent」</span><span id="quote"></span></div>
  </div>
<script>
(function () {
  var seq = 0;
  function callAction(actionId, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      function onMsg(e) {
        var m = e.data;
        if (m && m.type === 'callActionResult' && m.id === id) {
          window.removeEventListener('message', onMsg);
          if (m.ok) resolve(m.data); else reject(new Error(m.error || '调用失败'));
        }
      }
      window.addEventListener('message', onMsg);
      window.parent.postMessage({ type: 'callAction', id: id, actionId: actionId, payload: payload || {} }, '*');
    });
  }

  var papers = [];
  var records = [];
  var current = null;
  var pageNo = 1;
  var view = 'papers';       // papers | records
  var pending = null;        // 待高亮的 {paper_id, page, start, end}

  var elList = document.getElementById('list');
  var elTitle = document.getElementById('title');
  var elPage = document.getElementById('page');
  var elRecord = document.getElementById('record');
  var elPager = document.getElementById('pager');
  var elStatus = document.getElementById('status');
  var elQuote = document.getElementById('quote');
  var elImp = document.getElementById('imp');
  var elPath = document.getElementById('path');
  var elErr = document.getElementById('err');
  var elSideTitle = document.getElementById('sideTitle');
  var btnPrev = document.getElementById('prev');
  var btnNext = document.getElementById('next');
  var btnSend = document.getElementById('send');
  var btnPick = document.getElementById('pick');
  var btnBrowse = document.getElementById('browse');
  var btnImport = document.getElementById('doimport');
  var tabPapers = document.getElementById('tabPapers');
  var tabRecords = document.getElementById('tabRecords');

  function setStatus(text) { elStatus.textContent = text; }
  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- 侧栏列表 ----------

  function renderPapers() {
    elList.innerHTML = '';
    if (!papers.length) {
      elList.appendChild(hintRow('（暂无）'));
      return;
    }
    papers.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'paper' + (view === 'papers' && current && p.id === current.id ? ' active' : '');
      row.innerHTML = '<span class="t"></span><span class="m"></span>';
      row.querySelector('.t').textContent = p.title || p.id;
      row.querySelector('.m').textContent = p.page_count + ' 页 · ' + (p.file_name || '');
      row.onclick = function () { openPaper(p); };
      elList.appendChild(row);
    });
  }

  function renderRecords() {
    elList.innerHTML = '';
    if (!records.length) {
      elList.appendChild(hintRow('（还没有研究记录）'));
      return;
    }
    records.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'paper' + (view === 'records' && current && r.id === current.id ? ' active' : '');
      row.innerHTML = '<span class="t"></span><span class="m"></span>';
      row.querySelector('.t').textContent = r.title || r.question || r.id;
      row.querySelector('.m').textContent =
        (r.claims || []).length + ' 条结论 · ' + (r.acceptance || '');
      row.onclick = function () { openRecord(r); };
      elList.appendChild(row);
    });
  }

  function hintRow(text) {
    var row = document.createElement('div');
    row.className = 'paper';
    row.style.cursor = 'default';
    row.textContent = text;
    return row;
  }

  function renderList() {
    if (view === 'papers') renderPapers(); else renderRecords();
  }

  // ---------- 论文视图 ----------

  function openPaper(paper, jump) {
    view = 'papers';
    current = paper;
    pageNo = jump && jump.page ? jump.page : 1;
    pending = jump || null;
    tabPapers.classList.add('on'); tabRecords.classList.remove('on');
    elSideTitle.textContent = '论文库';
    elPage.hidden = false; elRecord.hidden = true;
    btnPrev.hidden = false; btnNext.hidden = false; btnSend.hidden = false;
    elPager.hidden = false;
    renderList();
    elTitle.textContent = paper.title || paper.id;
    loadPage();
  }

  function syncPager() {
    var total = current && current.page_count ? current.page_count : 0;
    elPager.textContent = total ? (pageNo + ' / ' + total) : '';
    btnPrev.disabled = !total || pageNo <= 1;
    btnNext.disabled = !total || pageNo >= total;
  }

  function loadPage() {
    if (!current) return;
    elPage.textContent = '载入中…';
    fetch('/api/papers/' + encodeURIComponent(current.id) + '/pages/' + pageNo)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        elPage.textContent = data.text || '（这一页没有文本）';
        elPage.scrollTop = 0;
        syncPager();
        clearSelection();
        if (pending) {
          var hit = highlightRange(pending.start, pending.end);
          if (hit) setStatus('已定位到引文所在位置');
          pending = null;
        }
      })
      .catch(function (err) { elPage.textContent = '读取失败：' + err.message; });
  }

  function highlightRange(start, end) {
    var node = elPage.firstChild;
    if (!node || node.nodeType !== 3) return false;
    if (typeof start !== 'number' || typeof end !== 'number') return false;
    if (start < 0 || end > node.textContent.length || end <= start) return false;
    var range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, end);
    var mark = document.createElement('mark');
    try { range.surroundContents(mark); } catch (e) { return false; }
    mark.scrollIntoView({ block: 'center' });
    return true;
  }

  function clearSelection() {
    btnSend.disabled = true;
    elQuote.textContent = '';
    if (view === 'papers') setStatus('选中正文里的一段，再点「发送给 Agent」');
  }

  function selectedQuote() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) return '';
    return String(sel).replace(/\s+/g, ' ').trim();
  }

  document.addEventListener('selectionchange', function () {
    if (view !== 'papers') return;
    var quote = selectedQuote();
    btnSend.disabled = !quote;
    elQuote.textContent = quote ? '「' + quote.slice(0, 60) + (quote.length > 60 ? '…' : '') + '」' : '';
  });

  var elReceiptPick = document.getElementById('receiptpick');
  var receipts = [];

  function loadReceipts() {
    return fetch('/api/data/receipts')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        receipts = data.receipts || [];
        elReceiptPick.innerHTML = '';
        if (!receipts.length) { elReceiptPick.hidden = true; return; }
        var none = document.createElement('option');
        none.value = '';
        none.textContent = '（不附数据收据）';
        elReceiptPick.appendChild(none);
        receipts.forEach(function (r) {
          var option = document.createElement('option');
          option.value = r.query_id;
          option.textContent = '数据收据 ' + r.query_id + ' · ' + (r.question || '') +
            (r.unit ? '（' + r.unit + '）' : '');
          elReceiptPick.appendChild(option);
        });
        elReceiptPick.hidden = false;
      })
      .catch(function () { elReceiptPick.hidden = true; });
  }

  btnSend.onclick = function () {
    var quote = selectedQuote();
    if (!quote || !current) return;
    var payload = {
      paper_id: current.id, title: current.title || '', page: pageNo,
      page_count: current.page_count, quote: quote
    };
    var events = [{ type: 'paper-evidence', content: JSON.stringify(payload) }];
    var ask = '请核对这段引文：论文《' + (current.title || current.id) + '》第 ' + pageNo +
      ' 页的「' + quote + '」——原文是否支持它？在哪一页？';
    var receiptId = elReceiptPick.value;
    if (receiptId) {
      var receipt = receipts.filter(function (r) { return r.query_id === receiptId; })[0] || {};
      events.push({ type: 'data-receipt', content: JSON.stringify({
        receipt_id: receiptId,
        dataset_id: receipt.dataset_id || '',
        asset_id: receipt.asset_id || '',
        sha256: receipt.sha256 || '',
        question: receipt.question || '',
        unit: receipt.unit || '',
        grain: receipt.grain || '',
        denominator: receipt.denominator || '',
        row_count: receipt.row_count == null ? null : receipt.row_count,
        summary: receipt.summary || {}
      }) });
      ask = '请把这段引文和这条数据查询收据合起来核对：引文在论文《' + (current.title || current.id) +
        '》第 ' + pageNo + ' 页的「' + quote + '」；收据 ' + receiptId + ' 回答的是「' +
        (receipt.question || '') + '」。请给出原文依据，并说明两边的数字是否对得上。';
    }
    events.push({ type: 'user', content: ask });
    callAction('chat.sendBatch', { events: events }).then(function () {
      setStatus(receiptId ? '已把引文与数据收据一起发送给 Agent' : '已发送给 Agent');
      clearSelection();
    }).catch(function (err) { setStatus('发送失败：' + err.message); });
  };

  btnPrev.onclick = function () { if (pageNo > 1) { pageNo -= 1; loadPage(); } };
  btnNext.onclick = function () {
    if (current && pageNo < current.page_count) { pageNo += 1; loadPage(); }
  };

  // ---------- 研究记录视图 ----------

  function openRecord(record) {
    view = 'records';
    current = record;
    tabRecords.classList.add('on'); tabPapers.classList.remove('on');
    elSideTitle.textContent = '研究记录';
    elPage.hidden = true; elRecord.hidden = false;
    btnPrev.hidden = true; btnNext.hidden = true; btnSend.hidden = true; elPager.hidden = true;
    renderList();
    elTitle.textContent = record.title || record.question || record.id;
    setStatus('研究记录：证据只说明引文在原文的位置，不说明结论成立');
    renderRecord(record);
  }

  function renderRecord(record) {
    var acceptance = record.acceptance || 'unverified';
    var badgeClass = acceptance === 'accepted' ? 'ok' : (acceptance === 'unverified' ? 'warn' : '');
    var html = '<h2></h2>';
    html += '<div class="meta">可信度状态 <span class="badge ' + badgeClass + '">' + esc(acceptance) + '</span>';
    html += ' · ' + esc(record.created_at || '') + ' · <code>' + esc(record.id) + '</code></div>';
    html += '<div><strong>问题：</strong>' + esc(record.question) + '</div>';
    html += '<h3>结论</h3>';

    (record.claims || []).forEach(function (claim) {
      html += '<div class="claim ' + esc(claim.stance || '') + '">';
      html += '<div class="ct">' + esc(claim.text) + '</div>';
      (claim.evidence || []).forEach(function (ev) {
        if (ev.kind === 'data') {
          html += '<div class="ev data">';
          html += '<div class="rq">数据收据 ' + esc(ev.receipt_id || '') + '</div>';
          html += '<div class="rm">' + esc(ev.question || '') + '</div>';
          html += '<div class="rm">';
          if (ev.unit) html += '单位 ' + esc(ev.unit) + ' · ';
          if (ev.grain) html += '粒度 ' + esc(ev.grain) + ' · ';
          html += esc(ev.row_count == null ? '' : ev.row_count) + ' 行 · ' + esc(ev.dataset_id || '');
          html += '</div>';
          html += '</div>';
          return;
        }
        html += '<div class="ev">';
        html += '<button class="link cite" data-paper="' + esc(ev.paper_id) + '" data-page="' + ev.page + '">';
        html += esc(ev.paper_id) + ' 第 ' + ev.page + ' 页 ↗</button>';
        if (ev.verification && ev.verification !== 'exact-match') {
          html += ' <span class="badge warn">' + esc(ev.verification) + '</span>';
        }
        html += '<blockquote>' + esc(ev.quote) + '</blockquote>';
        html += '</div>';
      });
      var check = claim.numeric_check;
      if (check) {
        html += '<div class="check ' + esc(check.status || '') + '">';
        html += '数字比对：' + esc(check.status || '') + ' · ';
        (check.matched || []).forEach(function (m) {
          html += '原文 ' + esc(m.paper) + ' ↔ 数据 ' + esc(m.data);
          if (m.note) html += '（' + esc(m.note) + '）';
          html += '；';
        });
        (check.notes || []).forEach(function (n) { html += ' ' + esc(n); });
        html += '</div>';
      }
      html += '<div class="actions"><button class="link follow" data-claim="' + esc(claim.id) + '">从此处追问 →</button></div>';
      html += '</div>';
    });

    if ((record.findings || []).length) {
      html += '<h3>发现</h3><ul>';
      (record.findings || []).forEach(function (f) { html += '<li>' + esc(f) + '</li>'; });
      html += '</ul>';
    }
    if ((record.gaps || []).length) {
      html += '<h3>未解决的问题</h3><ul>';
      (record.gaps || []).forEach(function (g) { html += '<li>' + esc(g) + '</li>'; });
      html += '</ul>';
    }

    html += '<h3>人工复核</h3><div class="actions">';
    html += '<button class="review" data-value="needs_review">标为待复核</button>';
    html += '<button class="review" data-value="accepted">标为已接受</button>';
    html += '<button class="review" data-value="rejected">标为已否决</button>';
    html += '<button class="review" data-value="unverified">回到未核实</button>';
    html += '</div>';

    html += '<div class="foot">证据只说明引文出现在原文的哪一页，不说明结论在科学上成立。<br />';
    html += '「从此处追问」会带上这条记录的问题、结论与引文，但之前的回答不会被当作证据。</div>';

    elRecord.innerHTML = html;
    elRecord.querySelectorAll('.cite').forEach(function (btn) {
      btn.onclick = function () { jumpToEvidence(btn); };
    });
    elRecord.querySelectorAll('.follow').forEach(function (btn) {
      btn.onclick = function () { followUp(btn); };
    });
    elRecord.querySelectorAll('.review').forEach(function (btn) {
      btn.onclick = function () { review(btn); };
    });
  }

  function jumpToEvidence(btn) {
    var paperId = btn.getAttribute('data-paper');
    var page = parseInt(btn.getAttribute('data-page'), 10);
    var paper = papers.filter(function (p) { return p.id === paperId; })[0];
    if (!paper) {
      setStatus('这篇论文不在论文库里，无法跳转');
      return;
    }
    var evidence = null;
    (current.claims || []).forEach(function (claim) {
      (claim.evidence || []).forEach(function (ev) {
        if (ev.paper_id === paperId && ev.page === page && !evidence) evidence = ev;
      });
    });
    var candidate = evidence && (evidence.candidates || [])[0];
    openPaper(paper, candidate ? { paper_id: paperId, page: page, start: candidate.start, end: candidate.end } : { paper_id: paperId, page: page });
  }

  function followUp(btn) {
    var claimId = btn.getAttribute('data-claim');
    var claim = (current.claims || []).filter(function (c) { return c.id === claimId; })[0];
    if (!claim) return;
    var payload = {
      record_id: current.id,
      claim_id: claim.id,
      question: current.question,
      claim: claim.text,
      stance: claim.stance,
      evidence: (claim.evidence || []).map(function (ev) {
        return { paper_id: ev.paper_id, page: ev.page, quote: ev.quote };
      })
    };
    callAction('chat.sendBatch', { events: [
      { type: 'research-record', content: JSON.stringify(payload) },
      { type: 'user', content: '就研究记录《' + (current.title || current.id) + '》里的这条结论继续追问：' + claim.text + '——请给出原文依据，并说明还有哪些证据缺口。' }
    ] }).then(function () {
      setStatus('已带着这条记录发送给 Agent');
    }).catch(function (err) { setStatus('发送失败：' + err.message); });
  }

  function review(btn) {
    var value = btn.getAttribute('data-value');
    fetch('/api/research/records/' + encodeURIComponent(current.id) + '/acceptance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ acceptance: value, note: '面板人工复核' })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (updated) {
        current = updated;
        renderRecord(updated);
        return refreshRecords();
      })
      .then(function () { setStatus('已更新可信度状态'); })
      .catch(function (err) { setStatus('更新失败：' + err.message); });
  }

  // ---------- 视图切换与数据 ----------

  function refreshPapers() {
    return fetch('/api/papers').then(function (r) { return r.json(); })
      .then(function (data) { papers = data.papers || []; renderList(); return papers; });
  }

  function refreshRecords() {
    return fetch('/api/research/records').then(function (r) { return r.json(); })
      .then(function (data) { records = data.records || []; renderList(); return records; });
  }

  function switchView(next) {
    view = next;
    current = null;
    elPage.hidden = next === 'records';
    elRecord.hidden = next !== 'records';
    btnPrev.hidden = next === 'records';
    btnNext.hidden = next === 'records';
    btnSend.hidden = next === 'records';
    elPager.hidden = next === 'records';
    tabPapers.classList.toggle('on', next === 'papers');
    tabRecords.classList.toggle('on', next === 'records');
    elSideTitle.textContent = next === 'papers' ? '论文库' : '研究记录';
    elTitle.textContent = next === 'papers' ? '未选择论文' : '未选择记录';
    elRecord.innerHTML = '';
    renderList();
    if (next === 'records') {
      elPage.innerHTML = '<div id="empty">从左边选一条研究记录，或让 Agent 用 <code>ResearchRecord</code> 工具保存一条。</div>';
    } else {
      elPage.innerHTML = '<div id="empty">从左边选一篇论文开始读。</div>';
    }
  }

  tabPapers.onclick = function () { switchView('papers'); };
  tabRecords.onclick = function () { switchView('records'); };

  // ---------- 导入 ----------

  function doImport(path) {
    if (!path) { elErr.textContent = '请填写 PDF 的路径'; return; }
    elErr.textContent = '导入中…（解析大 PDF 需要几秒）';
    btnImport.disabled = true;
    fetch('/api/papers/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path })
    })
      .then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
          return d;
        });
      })
      .then(function (meta) {
        elErr.textContent = ''; elImp.hidden = true; elPath.value = '';
        return refreshPapers().then(function () { openPaper(meta); });
      })
      .catch(function (err) { elErr.textContent = '导入失败：' + err.message; })
      .then(function () { btnImport.disabled = false; });
  }

  btnPick.onclick = function () {
    elImp.hidden = !elImp.hidden;
    elErr.textContent = '';
    if (!elImp.hidden) elPath.focus();
  };

  btnBrowse.onclick = function () {
    // 原生文件选择只在桌面端可用：插件与宿主同源，可以直接读宿主暴露的 preload 能力。
    // 不先探测的话，独立浏览器里这个调用会一直悬着，用户看不到任何反馈。
    var host = window.parent;
    if (!host || !host.purrcat || !host.purrcat.openDialog) {
      elErr.textContent = '当前环境没有原生文件选择，请直接填写 PDF 的路径';
      return;
    }
    callAction('dialog.files', {})
      .then(function (paths) {
        if (paths && paths.length) elPath.value = paths[0];
        else elErr.textContent = '没有选择文件';
      })
      .catch(function (err) {
        elErr.textContent = '原生文件选择不可用（' + err.message + '），请直接填写路径';
      });
  };

  btnImport.onclick = function () { doImport(elPath.value.trim()); };
  elPath.onkeydown = function (e) { if (e.key === 'Enter') doImport(elPath.value.trim()); };

  // ---------- 启动 ----------

  refreshPapers().then(function (list) { if (list.length) openPaper(list[0]); });
  refreshRecords().catch(function () { /* 目录读不到不影响读论文 */ });
  loadReceipts().catch(function () { /* 没有数据收据不影响读论文 */ });
})();
</script>
</body>
</html>
